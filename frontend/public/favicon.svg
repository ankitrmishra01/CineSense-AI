<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6e05e" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </radialGradient>
  </defs>
  <!-- Noir Background Circle -->
  <rect width="32" height="32" rx="8" fill="#0e0d0c" />
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-opacity="0.5" />
  
  <!-- Outer Film Reel Rim -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Center Spindle -->
  <circle cx="16" cy="16" r="3.2" fill="#0e0d0c" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="16" cy="16" r="1.2" fill="#d4af37" />
  
  <!-- 4 Film Reel Apertures -->
  <circle cx="16" cy="9.5" r="1.6" fill="url(#goldGrad)" />
  <circle cx="16" cy="22.5" r="1.6" fill="url(#goldGrad)" />
  <circle cx="9.5" cy="16" r="1.6" fill="url(#goldGrad)" />
  <circle cx="22.5" cy="16" r="1.6" fill="url(#goldGrad)" />
</svg>