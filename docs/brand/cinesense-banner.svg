<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="50%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="199" rx="15.5" stroke="#22314b"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="120" cy="100" r="70" fill="#14b8a6" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo Icon Container -->
  <rect x="72" y="52" width="96" height="96" rx="24" fill="#0f1724" stroke="#22314b" stroke-width="2"/>
  <rect x="76" y="56" width="88" height="88" rx="20" fill="rgba(20, 184, 166, 0.1)"/>

  <!-- Aperture Pulse Icon -->
  <g transform="translate(88, 68) scale(2)">
    <path d="M16 3C8.82 3 3 8.82 3 16s5.82 13 13 13c3.6 0 6.88-1.46 9.25-3.83-5.2 0-9.42-4.22-9.42-9.42 0-4.08 2.6-7.55 6.27-8.86C20.17 4.24 18.17 3 16 3z" fill="url(#tealGrad)"/>
    <path d="M24 10l1.2 2.8L28 14l-2.8 1.2L24 18l-1.2-2.8L20 14l2.8-1.2L24 10z" fill="url(#starGrad)"/>
  </g>

  <!-- Title & Tagline -->
  <text x="195" y="105" font-family="'Cormorant Garamond', Georgia, serif" font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">CineSense</text>
  
  <!-- AI Badge -->
  <g transform="translate(425, 68)">
    <rect width="36" height="22" rx="11" fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="18" y="15" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="1">AI</text>
  </g>

  <text x="198" y="138" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Emotion-Aware Movie Discovery &amp; Intelligent Recommendations</text>
</svg>
